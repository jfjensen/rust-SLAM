[package]
name = "av01_motion_and_scan"
version = "0.1.0"
edition = "2024"

# Autonomous vehicles 01: Unit A of Claus Brenner's SLAM course (motion
# model and cylinder detection), on synthetic data. The algorithms and the
# synthetic robot are in the av_sim library; this app is the viewer.
[dependencies]
bevy = "0.20"
av_sim = { path = "../av_sim" }

# `dev` (on by default) switches on Bevy's dynamic_linking for fast
# rebuilds. For a stand-alone exe:
#     cargo build --release --no-default-features
[features]
default = ["dev"]
dev = ["bevy/dynamic_linking", "av_sim/dev"]
