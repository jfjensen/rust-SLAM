[package]
name = "av08_path_planning"
version = "0.1.0"
edition = "2024"

# Autonomous vehicles 08: Unit PP of Claus Brenner's SLAM course (path
# planning: Dijkstra, A*, a potential function, a car's state space).
# The planners are in av_sim; this is the viewer and editor.
[dependencies]
bevy = "0.20"
av_sim = { path = "../av_sim" }

# `dev` (on by default) switches on Bevy's dynamic_linking for fast
# rebuilds. For a stand-alone exe:
#     cargo build --release --no-default-features
[features]
default = ["dev"]
dev = ["bevy/dynamic_linking", "av_sim/dev"]
