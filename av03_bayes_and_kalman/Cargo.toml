[package]
name = "av03_bayes_and_kalman"
version = "0.1.0"
edition = "2024"

# Autonomous vehicles 03: Unit C of Claus Brenner's SLAM course (the Bayes
# filter in 1D: histogram filter and Kalman filter), on a synthetic track.
# The filters and the track robot are in av_sim; this is the viewer.
[dependencies]
bevy = "0.20"
av_sim = { path = "../av_sim" }

# `dev` (on by default) switches on Bevy's dynamic_linking for fast
# rebuilds. For a stand-alone exe:
#     cargo build --release --no-default-features
[features]
default = ["dev"]
dev = ["bevy/dynamic_linking", "av_sim/dev"]
